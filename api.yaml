apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-api
  template:
    metadata:
      labels:
        app: dealership-api
    spec:
      containers:
        - name: dealership-api
          image: us.icr.io/sn-labs-kashmiranaik/dealership-api:latest
          ports:
            - containerPort: 3030
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api
spec:
  selector:
    app: dealership-api
  ports:
    - port: 3030
      targetPort: 3030
